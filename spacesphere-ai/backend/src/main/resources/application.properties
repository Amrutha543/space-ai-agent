server.port=8080

# Anthropic API key - set as an environment variable, never commit a real key here
anthropic.api.key=${ANTHROPIC_API_KEY:}

# NASA API key - get a free one at https://api.nasa.gov (DEMO_KEY works but is rate-limited)
nasa.api.key=${NASA_API_KEY:DEMO_KEY}

# Allowed origin(s) for the React frontend
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
